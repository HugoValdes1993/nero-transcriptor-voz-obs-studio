<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Subtítulos en vivo — Original</title>
<style>
  :root {
    /* Defaults de fábrica (ver OVERLAY_STYLE_DEFAULTS en
       config/user_config.py). El mensaje {"type": "style", ...} que manda
       el servidor pisa estas variables apenas se conecta. Los valores
       "original_*" son los únicos que le importan a esta página — el otro
       overlay (obs_overlay_translated.html) usa los "translated_*". */
    --overlay-bottom: 40px;
    --overlay-padding: 12px 24px;
    --overlay-radius: 10px;
    --overlay-bg: rgba(0, 0, 0, 0.55);
    --text-font-family: "Segoe UI", Arial, sans-serif;
    --text-font-size: 26px;
    --text-color: #ffffff;
    --text-weight: 700;
    --text-width: 800px;
    --text-height: 80px;
    --text-stroke-width: 0px;
    --text-stroke-color: #000000;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100%;
  }
  #subtitle-container {
    position: fixed;
    bottom: var(--overlay-bottom);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    padding: 0 40px;
  }
  #subtitle-text {
    /* box-sizing: border-box para que width/height sean el tamaño final
       real del cuadro (padding incluido) — así coincide exactamente con
       la zona reservada en el lienzo de OBS, sin que el padding la agrande. */
    box-sizing: border-box;
    width: var(--text-width);
    height: var(--text-height);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--overlay-bg);
    padding: var(--overlay-padding);
    border-radius: var(--overlay-radius);
    text-align: center;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    transition: opacity 0.2s ease-in-out;
    font-family: var(--text-font-family);
    font-size: var(--text-font-size);
    color: var(--text-color);
    font-weight: var(--text-weight);
    -webkit-text-stroke: var(--text-stroke-width) var(--text-stroke-color);
  }
  /* Texto parcial (final: false): tentativo, todavía puede cambiar cuando
     llegue la transcripción final de la misma frase. */
  #subtitle-container.subtitle-partial #subtitle-text {
    font-style: italic;
    opacity: 0.7;
  }
  .subtitle-line-hidden {
    display: none !important;
  }

  /* Efectos de aparición del texto FINAL de un subtítulo — ver
     playSubtitleAnimation() más abajo. El texto tentativo (parcial) nunca
     dispara estos efectos, así que no hace falta que convivan con la regla
     de arriba (#subtitle-container.subtitle-partial #subtitle-text). */
  @keyframes subtitle-anim-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .subtitle-anim-fade {
    animation: subtitle-anim-fade 0.4s ease-out;
  }

  @keyframes subtitle-anim-bounce {
    0%   { opacity: 0; transform: translateY(30px) scale(0.9); }
    60%  { opacity: 1; transform: translateY(-8px) scale(1.03); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .subtitle-anim-bounce {
    animation: subtitle-anim-bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Unos saltos bruscos de posición/recorte/color antes de asentarse en el
     text-shadow normal (0 2px 4px rgba(0,0,0,.6), igual que la regla base
     de #subtitle-text) — steps(1, end) hace que cada tramo sea un corte
     seco en vez de una interpolación suave, que es justamente el efecto
     "glitcheado" buscado. El "round var(--overlay-radius)" del clip-path
     mantiene las puntas redondeadas del cuadro aunque esté cortado. */
  @keyframes subtitle-anim-glitch {
    0%   { opacity: 0; transform: translate(0, 0); clip-path: inset(10% 0 40% 0 round var(--overlay-radius)); text-shadow: -3px 0 #ff2b6d, 3px 0 #00e5ff; }
    10%  { opacity: 1; transform: translate(-4px, 2px); clip-path: inset(60% 0 5% 0 round var(--overlay-radius)); text-shadow: 3px 0 #ff2b6d, -3px 0 #00e5ff; }
    20%  { transform: translate(3px, -2px); clip-path: inset(20% 0 55% 0 round var(--overlay-radius)); text-shadow: -2px 0 #ff2b6d, 2px 0 #00e5ff; }
    30%  { transform: translate(-2px, 1px); clip-path: inset(75% 0 2% 0 round var(--overlay-radius)); text-shadow: 2px 0 #ff2b6d, -2px 0 #00e5ff; }
    45%  { transform: translate(2px, 0); clip-path: inset(5% 0 60% 0 round var(--overlay-radius)); text-shadow: -1px 0 #ff2b6d, 1px 0 #00e5ff; }
    60%  { transform: translate(0, 0); clip-path: inset(0 0 0 0 round var(--overlay-radius)); text-shadow: 1px 0 #ff2b6d, -1px 0 #00e5ff; }
    100% { transform: translate(0, 0); clip-path: inset(0 0 0 0 round var(--overlay-radius)); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6); }
  }
  .subtitle-anim-glitch {
    animation: subtitle-anim-glitch 0.5s steps(1, end);
  }
</style>
</head>
<body>
  <div id="subtitle-container">
    <div id="subtitle-text"></div>
  </div>

  <script>
    const WEBSOCKET_URL = "ws://localhost:8765";
    const DEFAULT_SUBTITLE_CLEAR_DELAY_MS = 6000;

    const subtitleContainerElement = document.getElementById("subtitle-container");
    const subtitleTextElement = document.getElementById("subtitle-text");
    let clearSubtitleTimeoutId = null;

    // Actualizado por applyOverlayStyle() cuando llega un mensaje de estilo
    // con clear_delay_ms; empieza en el mismo default de fábrica que usa
    // config/user_config.py hasta que el servidor mande el valor real.
    let subtitleClearDelayMs = DEFAULT_SUBTITLE_CLEAR_DELAY_MS;

    // Nombre del efecto de aparición actual ("none"/"fade"/"bounce"/
    // "glitch" — ver SUBTITLE_ANIMATION_CHOICES en config/user_config.py),
    // actualizado por applyOverlayStyle().
    let currentAnimationName = "none";
    const ANIMATION_CLASS_PREFIX = "subtitle-anim-";

    function playSubtitleAnimation() {
      if (currentAnimationName === "none") return;
      const className = ANIMATION_CLASS_PREFIX + currentAnimationName;
      // Sacar la clase y forzar reflow antes de volver a ponerla: si la
      // frase anterior ya usó este mismo efecto, el navegador no vuelve a
      // reproducir una animación CSS cuya clase nunca se sacó.
      subtitleTextElement.classList.remove(className);
      void subtitleTextElement.offsetWidth;
      subtitleTextElement.classList.add(className);
    }

    function hexToRgba(hexColor, opacity) {
      const hex = hexColor.replace("#", "");
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${opacity})`;
    }

    // Aplica un mensaje {"type": "style", ...} (ver
    // config/user_config.OVERLAY_STYLE_DEFAULTS) como variables CSS. Esta
    // página solo usa las propiedades generales y las "original_*" — las
    // "translated_*" del mismo mensaje se ignoran aquí a propósito.
    function applyOverlayStyle(style) {
      const root = document.documentElement.style;
      root.setProperty("--overlay-bottom", `${style.bottom_offset_px}px`);
      root.setProperty("--overlay-padding", `${style.padding_px}px ${style.padding_px * 2}px`);
      root.setProperty("--overlay-radius", `${style.border_radius_px}px`);
      root.setProperty("--overlay-bg", hexToRgba(style.background_color, style.background_opacity));

      root.setProperty("--text-font-family", `"${style.original_font_family}", sans-serif`);
      root.setProperty("--text-font-size", `${style.original_font_size_px}px`);
      root.setProperty("--text-color", hexToRgba(style.original_text_color, style.original_text_opacity));
      root.setProperty("--text-weight", style.original_font_weight);
      root.setProperty("--text-width", `${style.original_width_px}px`);
      root.setProperty("--text-height", `${style.original_height_px}px`);
      root.setProperty("--text-stroke-width", `${style.original_text_stroke_width_px}px`);
      root.setProperty("--text-stroke-color", style.original_text_stroke_color);
      currentAnimationName = style.original_animation;

      subtitleClearDelayMs = style.clear_delay_ms;
    }

    function connectToTranscriptionServer() {
      const socket = new WebSocket(WEBSOCKET_URL);

      socket.onmessage = (event) => {
        const payload = JSON.parse(event.data);

        if (payload.type === "style") {
          applyOverlayStyle(payload);
          return;
        }

        // displayMode viene del servidor (TRANSLATION_DISPLAY_MODE en
        // config/settings.py): "original_only", "translation_only" o
        // "both". Default defensivo a "original_only" si faltara el campo.
        const displayMode = payload.displayMode || "original_only";
        const showOriginal = displayMode === "original_only" || displayMode === "both";

        subtitleTextElement.textContent = showOriginal ? payload.original : "";
        subtitleTextElement.classList.toggle("subtitle-line-hidden", !showOriginal);

        // payload.final === false -> texto tentativo, todavía puede
        // reemplazarse por la versión final de la misma frase. El efecto de
        // aparición solo se dispara para texto FINAL — el tentativo cambia
        // varias veces por segundo mientras se sigue hablando, y animarlo
        // también saturaría la pantalla.
        const isFinal = payload.final !== false;
        subtitleContainerElement.classList.toggle("subtitle-partial", !isFinal);
        if (isFinal && showOriginal && payload.original) {
          playSubtitleAnimation();
        }

        clearTimeout(clearSubtitleTimeoutId);
        clearSubtitleTimeoutId = setTimeout(() => {
          subtitleTextElement.textContent = "";
        }, subtitleClearDelayMs);
      };

      socket.onclose = () => {
        console.warn("Conexión perdida con el servidor de transcripción, reintentando en 2s...");
        setTimeout(connectToTranscriptionServer, 2000);
      };

      socket.onerror = () => socket.close();
    }

    connectToTranscriptionServer();
  </script>
</body>
</html>
